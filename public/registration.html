<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; padding: 24px;
      display: grid; place-items: center; font-family: system-ui, Arial, sans-serif;
      color: #25334b; background: radial-gradient(circle at 15% 15%, #ffd7cb, transparent 34%),
      radial-gradient(circle at 90% 85%, #c5d8fa, transparent 36%), #f7f5fa;
    }
    .card {
      width: min(100%, 470px); padding: 34px; border-radius: 26px;
      background: #fff; box-shadow: 0 24px 65px #29315b22;
    }
    .symbol {
      display: grid; place-items: center; width: 48px; height: 48px;
      border-radius: 16px; background: #ede9fe; color: #6449bd; font-size: 27px;
    }
    h1 { margin: 17px 0 4px; font-size: 30px; letter-spacing: -.6px; }
    .subtitle { margin: 0 0 26px; color: #748097; line-height: 1.5; }
    .field { margin: 0 0 17px; }
    label { display: block; margin-bottom: 7px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%; padding: 13px 15px; border: 1.5px solid #dce1eb;
      border-radius: 12px; outline: none; font: inherit; color: #25334b;
    }
    input:focus { border-color: #8064d6; box-shadow: 0 0 0 3px #8064d622; }
    input.invalid { border-color: #d85870; background: #fff9fa; }
    .error { display: block; min-height: 18px; margin-top: 5px; color: #bd3854; font-size: 12px; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 12px;
      background: linear-gradient(120deg, #7758d1, #9c69d5); color: #fff;
      font: inherit; font-weight: 800; cursor: pointer;
    }
    button:hover { filter: brightness(1.07); }
    #success {
      margin: 16px 0 0; padding: 13px; border-radius: 11px;
      background: #e8f8ef; color: #22704a; text-align: center; font-size: 14px;
    }
    [hidden] { display: none !important; }
    @media (max-width: 400px) { .card { padding: 24px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="symbol" aria-hidden="true">✦</div>
    <h1>Create your account</h1>
    <p class="subtitle">A few details and you're ready to go.</p>

    <form id="registrationForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="e.g. Twinkle Singh" autocomplete="name" aria-describedby="nameError">
        <small class="error" id="nameError"></small>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" aria-describedby="emailError">
        <small class="error" id="emailError"></small>
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel" aria-describedby="phoneError">
        <small class="error" id="phoneError"></small>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" aria-describedby="passwordError">
        <small class="error" id="passwordError"></small>
      </div>
      <button type="submit">Create account →</button>
      <p id="success" role="status" hidden>✓ Form validated successfully!</p>
    </form>
  </main>

  <script>
    const form = document.getElementById('registrationForm');
    const success = document.getElementById('success');
    const fields = ['name', 'email', 'phone', 'password'];

    // Show or clear an error for one field.
    function setError(field, message) {
      document.getElementById(field + 'Error').textContent = message;
      document.getElementById(field).classList.toggle('invalid', message !== '');
      document.getElementById(field).setAttribute('aria-invalid', message !== '' ? 'true' : 'false');
    }

    function validateForm() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;

      fields.forEach(function (field) { setError(field, ''); });

      if (name.length < 2) {
        setError('name', 'Enter your name (at least 2 characters).');
        valid = false;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setError('email', 'Enter a valid email address.');
        valid = false;
      }

      if (!/^[0-9]{10}$/.test(phone)) {
        setError('phone', 'Enter exactly 10 digits.');
        valid = false;
      }

      if (password.length < 8) {
        setError('password', 'Password must have at least 8 characters.');
        valid = false;
      }

      return valid;
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault(); // Validate without refreshing the page.
      success.hidden = true;

      if (validateForm()) {
        success.hidden = false;
        form.reset();
      } else {
        form.querySelector('.invalid').focus();
      }
    });

    fields.forEach(function (field) {
      document.getElementById(field).addEventListener('input', function () {
        setError(field, '');
        success.hidden = true;
      });
    });
  </script>
</body>
</html>
